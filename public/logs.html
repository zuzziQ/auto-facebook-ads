<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Logs — Content Distributor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d14;
      color: #c9d1d9;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: .75rem 1.25rem;
      background: #161622;
      border-bottom: 1px solid #2a2a40;
      flex-shrink: 0;
    }
    header h1 { font-size: .95rem; font-weight: 600; color: #e6edf3; }
    .badge {
      font-size: .7rem;
      padding: .2rem .55rem;
      border-radius: 20px;
      font-weight: 600;
    }
    .badge--live { background: rgba(34,197,94,.15); color: #4ade80; border: 1px solid rgba(34,197,94,.3); }
    .badge--off { background: rgba(239,68,68,.12); color: #f87171; border: 1px solid rgba(239,68,68,.25); }
    .controls { margin-left: auto; display: flex; gap: .6rem; align-items: center; }
    .btn {
      padding: .35rem .75rem;
      border-radius: 8px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #2a2a40;
      background: #1e1e2e;
      color: #c9d1d9;
      transition: background .15s;
    }
    .btn:hover { background: #2a2a40; }
    .filter-bar {
      display: flex;
      gap: .5rem;
      padding: .6rem 1.25rem;
      background: #13131f;
      border-bottom: 1px solid #1e1e2e;
      flex-shrink: 0;
    }
    .filter-btn {
      padding: .25rem .65rem;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: #8b949e;
      transition: all .15s;
    }
    .filter-btn.active { background: #2a2a40; color: #e6edf3; border-color: #3a3a55; }
    .filter-btn.error.active { background: rgba(239,68,68,.15); color: #f87171; border-color: rgba(239,68,68,.3); }
    .filter-btn.warn.active { background: rgba(251,191,36,.1); color: #fbbf24; border-color: rgba(251,191,36,.25); }
    .filter-btn.info.active { background: rgba(99,179,237,.1); color: #63b3ed; border-color: rgba(99,179,237,.25); }
    #search { 
      margin-left: auto;
      padding: .25rem .65rem;
      background: #1e1e2e;
      border: 1px solid #2a2a40;
      border-radius: 8px;
      color: #c9d1d9;
      font-size: .8rem;
      outline: none;
      width: 200px;
    }
    #search:focus { border-color: #7c3aed; }
    #logContainer {
      flex: 1;
      overflow-y: auto;
      padding: .75rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: .78rem;
      line-height: 1.6;
    }
    .log-entry {
      padding: .2rem .5rem;
      border-radius: 4px;
      margin-bottom: .1rem;
      display: flex;
      gap: .75rem;
      align-items: flex-start;
      transition: background .1s;
    }
    .log-entry:hover { background: rgba(255,255,255,.03); }
    .log-ts { color: #484f5a; white-space: nowrap; flex-shrink: 0; }
    .log-lvl { font-weight: 700; width: 42px; flex-shrink: 0; text-align: center; }
    .log-msg { color: #c9d1d9; word-break: break-word; flex: 1; }
    .log-detail { color: #6e7681; font-size: .72rem; margin-top: .1rem; }
    .entry--error .log-lvl { color: #f87171; }
    .entry--error .log-msg { color: #fca5a5; }
    .entry--warn .log-lvl { color: #fbbf24; }
    .entry--info .log-lvl { color: #63b3ed; }
    .entry--debug .log-lvl { color: #a78bfa; }
    .empty {
      text-align: center;
      padding: 3rem;
      color: #484f5a;
      font-family: 'Inter', sans-serif;
    }
    .divider {
      text-align: center;
      color: #2a2a40;
      font-size: .7rem;
      padding: .25rem;
      border-top: 1px solid #1e1e2e;
      margin: .5rem 0;
    }
  </style>
</head>
<body>
  <header>
    <h1>📋 Live Logs</h1>
    <span class="badge badge--off" id="statusBadge">Connecting...</span>
    <div class="controls">
      <label style="font-size:.8rem;color:#8b949e;display:flex;align-items:center;gap:.4rem;cursor:pointer">
        <input type="checkbox" id="autoScroll" checked> Auto-scroll
      </label>
      <button class="btn" onclick="clearLogs()">Clear</button>
      <a href="/" class="btn" style="text-decoration:none">← Dashboard</a>
    </div>
  </header>
  <div class="filter-bar">
    <button class="filter-btn active" data-level="all" onclick="setFilter(this)">All</button>
    <button class="filter-btn error" data-level="error" onclick="setFilter(this)">Error</button>
    <button class="filter-btn warn" data-level="warn" onclick="setFilter(this)">Warn</button>
    <button class="filter-btn info" data-level="info" onclick="setFilter(this)">Info</button>
    <input type="text" id="search" placeholder="Filter messages..." oninput="applySearch(this.value)">
    <span id="logCount" style="font-size:.75rem;color:#484f5a;align-self:center">0 entries</span>
  </div>
  <div id="logContainer">
    <div class="empty" id="emptyMsg">⏳ Waiting for log events...</div>
  </div>

  <script>
    let allEntries = [];
    let activeFilter = 'all';
    let searchQuery = '';
    const container = document.getElementById('logContainer');
    const autoScroll = document.getElementById('autoScroll');
    const badge = document.getElementById('statusBadge');
    const countEl = document.getElementById('logCount');

    // Connect to SSE
    const es = new EventSource('/api/logs/stream');

    es.onopen = () => {
      badge.textContent = 'LIVE';
      badge.className = 'badge badge--live';
    };

    es.onerror = () => {
      badge.textContent = 'Disconnected';
      badge.className = 'badge badge--off';
    };

    es.addEventListener('log', (e) => {
      try {
        const entry = JSON.parse(e.data);
        allEntries.push(entry);
        if (allEntries.length > 2000) allEntries.shift();
        renderEntry(entry);
        countEl.textContent = `${allEntries.length} entries`;
        if (autoScroll.checked) container.scrollTop = container.scrollHeight;
      } catch {}
    });

    es.addEventListener('history', (e) => {
      try {
        const entries = JSON.parse(e.data);
        document.getElementById('emptyMsg')?.remove();
        entries.forEach(entry => {
          allEntries.push(entry);
          renderEntry(entry, true);
        });
        countEl.textContent = `${allEntries.length} entries`;
        if (autoScroll.checked) container.scrollTop = container.scrollHeight;
        if (entries.length > 0) {
          const div = document.createElement('div');
          div.className = 'divider';
          div.textContent = `↑ last ${entries.length} entries from error.log ↑`;
          const first = container.querySelector('.log-entry');
          if (first) container.insertBefore(div, first);
        }
      } catch {}
    });

    function renderEntry(entry, prepend = false) {
      const level = (entry.level || 'info').toLowerCase();
      const visible = matchesFilter(level, entry.message || '', entry.error || '');

      const div = document.createElement('div');
      div.className = `log-entry entry--${level}`;
      div.dataset.level = level;
      div.dataset.text = ((entry.message || '') + ' ' + (entry.error || '')).toLowerCase();
      div.style.display = visible ? '' : 'none';

      const ts = entry.timestamp ? new Date(entry.timestamp).toLocaleTimeString('vi-VN') : '';
      const errorDetail = entry.error ? `<div class="log-detail">↳ ${escHtml(entry.error)}</div>` : '';

      div.innerHTML = `
        <span class="log-ts">${ts}</span>
        <span class="log-lvl">${level.toUpperCase()}</span>
        <span class="log-msg">${escHtml(entry.message || JSON.stringify(entry))}${errorDetail}</span>`;

      document.getElementById('emptyMsg')?.remove();
      container.appendChild(div);
    }

    function matchesFilter(level, msg, err) {
      const text = (msg + ' ' + err).toLowerCase();
      if (activeFilter !== 'all' && level !== activeFilter) return false;
      if (searchQuery && !text.includes(searchQuery)) return false;
      return true;
    }

    function setFilter(btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.level;
      applyVisibility();
    }

    function applySearch(val) {
      searchQuery = val.toLowerCase();
      applyVisibility();
    }

    function applyVisibility() {
      let visible = 0;
      container.querySelectorAll('.log-entry').forEach(el => {
        const show = matchesFilter(el.dataset.level, el.dataset.text, '');
        el.style.display = show ? '' : 'none';
        if (show) visible++;
      });
      countEl.textContent = `${visible} / ${allEntries.length} entries`;
    }

    function clearLogs() {
      allEntries = [];
      container.innerHTML = '<div class="empty" id="emptyMsg">Cleared. Waiting for new events...</div>';
      countEl.textContent = '0 entries';
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
