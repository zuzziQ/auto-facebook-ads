<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cố Vấn Chiến Lược AI - Ads Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --bg: #0a0d14;
      --surface: #111520;
      --surface2: #161b2e;
      --border: #1e2540;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #6366f1;
      --accent2: #818cf8;
      --green: #10b981;
      --yellow: #f59e0b;
      --red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1f35 0%, #0d1022 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .header h1 { font-size: 20px; font-weight: 700; background: linear-gradient(135deg, #c4b5fd, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px;}
    .btn-back { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; text-decoration: none; transition: 0.2s; font-size: 13px; font-weight: 500;}
    .btn-back:hover { background: var(--surface2); color: var(--text); }

    /* Main layout */
    .layout-wrapper { display: flex; max-width: 1600px; margin: 0 auto; height: calc(100vh - 61px); }
    
    .sidebar { width: 320px; border-right: 1px solid var(--border); overflow-y: auto; background: var(--bg); padding: 20px; }
    .sidebar h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; }
    .history-item:hover { border-color: var(--accent); transform: translateX(2px); }
    .btn-delete-history { position: absolute; right: 8px; top: 12px; background: transparent; border: none; color: var(--muted); cursor: pointer; opacity: 0; transition: 0.2s; padding: 4px; border-radius: 4px; }
    .history-item:hover .btn-delete-history { opacity: 1; }
    .btn-delete-history:hover { background: rgba(239, 68, 68, 0.1); color: var(--red); }
    .history-item.active { border-color: var(--accent); background: rgba(99,102,241,0.1); }
    .history-time { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
    .history-service { font-size: 11px; color: var(--accent2); }
    .history-date { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .history-empty { font-size: 13px; color: var(--muted); text-align: center; padding: 20px 0; }

    .main { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg); position: relative; }

    .control-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 40px;
      display: flex;
      gap: 16px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    .form-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 200px; }
    .form-group label { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-control { background: #0a0d14; border: 1px solid #1e2540; color: #e2e8f0; padding: 12px 16px; border-radius: 8px; font-size: 14px; font-family: inherit; outline: none; transition: 0.2s;}
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(99,102,241,0.2); }

    .btn-generate {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      transition: opacity 0.2s;
      height: 45px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-generate:hover { opacity: 0.9; }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Markdown Report Styles */
    .report-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      min-height: 400px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    
    .loading-state {
      display: flex; flex-direction: column; align-items: center; justify-content: center; height: 300px; color: var(--muted); gap: 16px;
    }
    .spinner {
      width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent2); border-radius: 50%;
      animation: spin 1s infinite linear;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .markdown-body { font-size: 15px; line-height: 1.7; color: var(--text); }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { margin-top: 32px; margin-bottom: 16px; font-weight: 600; line-height: 1.25; }
    .markdown-body h1 { padding-bottom: .3em; border-bottom: 1px solid var(--border); font-size: 2em; }
    .markdown-body h2 { padding-bottom: .3em; border-bottom: 1px solid var(--border); font-size: 1.5em; color: var(--accent2); }
    .markdown-body h3 { font-size: 1.25em; }
    .markdown-body p, .markdown-body ul, .markdown-body ol { margin-top: 0; margin-bottom: 16px; }
    .markdown-body ul, .markdown-body ol { padding-left: 2em; }
    .markdown-body li { margin-bottom: 4px; }
    .markdown-body li > p { margin-top: 16px; }
    .markdown-body strong { font-weight: 600; color: #fff; }
    .markdown-body em { font-style: italic; color: #cbd5e1; }
    .markdown-body blockquote { margin: 0 0 16px; padding: 0 1em; color: var(--muted); border-left: .25em solid var(--border); }
    .markdown-body code { padding: .2em .4em; margin: 0; font-size: 85%; background-color: var(--surface2); border-radius: 6px; font-family: monospace; }
    .markdown-body pre { padding: 16px; overflow: auto; font-size: 85%; line-height: 1.45; background-color: var(--surface2); border-radius: 6px; }
    .markdown-body pre code { background-color: transparent; padding: 0; }
  </style>
</head>
<body>

<header class="header">
  <h1>✨ Cố Vấn Chiến Lược AI (Strategy Advisor)</h1>
  <a href="/ads-dashboard.html" class="btn-back">← Quay lại Dashboard</a>
</header>

<div class="layout-wrapper">
  
<aside class="sidebar">
  <h2>Lịch sử Báo cáo</h2>
  <div class="history-list" id="history-list">
    <div class="history-empty">Đang tải...</div>
  </div>
</aside>

<main class="main">
  <div class="control-panel">
    <div class="form-group">
      <label>Thời gian phân tích</label>
      <select id="time-range" class="form-control" onchange="updateCustomDates()">
        <option value="7">7 ngày qua</option>
        <option value="14">14 ngày qua</option>
        <option value="30" selected>30 ngày qua (Tháng này)</option>
        <option value="custom">Tùy chỉnh...</option>
      </select>
    </div>
    
    <div class="form-group" style="display:none" id="custom-date-group">
      <label>Từ ngày - Đến ngày</label>
      <div style="display:flex;gap:8px">
        <input type="date" id="start-date" class="form-control" style="flex:1">
        <input type="date" id="end-date" class="form-control" style="flex:1">
      </div>
    </div>

    <div class="form-group">
      <label>Dịch vụ (Mảng)</label>
      <select id="service-select" class="form-control">
        <option value="all">Tất cả bài chạy</option>
        <option value="umau_">U máu / U mạch máu</option>
        <option value="chambot_">Chàm bớt (Ota/Abnom)</option>
        <option value="nam_">Nám da / Tàn nhang</option>
        <option value="trehoa_">Trẻ hóa da</option>
        <option value="lumislim_">LumiSlim (Giảm béo)</option>
        <option value="csd_">Chăm sóc da</option>
      </select>
    </div>

    <div class="form-group" style="flex-basis: 100%;">
      <label>Chỉ số tuần này (Nhập thủ công)</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <input type="number" id="input-leads" class="form-control" placeholder="Số Lead" style="flex:1;min-width:120px;">
        <input type="number" id="input-bookings" class="form-control" placeholder="Số Hẹn" style="flex:1;min-width:120px;">
        <input type="number" id="input-arrivals" class="form-control" placeholder="Số Đến" style="flex:1;min-width:120px;">
        <input type="number" id="input-deals" class="form-control" placeholder="Số Chốt" style="flex:1;min-width:120px;">
        <input type="number" id="input-revenue" class="form-control" placeholder="Doanh thu (VNĐ)" style="flex:1;min-width:150px;">
      </div>
    </div>

    <button class="btn-generate" id="btn-submit" onclick="generateStrategy()">
      <span>🧠 Lập Kế Hoạch </span>
    </button>
  </div>

  <div class="report-container" id="report-wrap">
    <div style="text-align:center; color:var(--muted); padding: 80px 0;">
      <div style="font-size:40px; margin-bottom:16px;">📈</div>
      <h3>Chưa có dữ liệu phân tích</h3>
      <p style="margin-top:8px;">Hãy chọn thời gian, dịch vụ phía trên và ấn Lập Kế Hoạch để AI bắt đầu quét cấu trúc Content toàn viện.</p>
    </div>
  </div>

</main>

</div>

<script>
  function dt(dateObj) {
    const y = dateObj.getFullYear();
    const m = String(dateObj.getMonth()+1).padStart(2,'0');
    const d = String(dateObj.getDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }

  function updateCustomDates() {
    const val = document.getElementById('time-range').value;
    const cg = document.getElementById('custom-date-group');
    if (val === 'custom') {
      cg.style.display = 'flex';
      return;
    }
    cg.style.display = 'none';
    
    const end = new Date();
    const start = new Date();
    start.setDate(end.getDate() - parseInt(val));
    
    document.getElementById('start-date').value = dt(start);
    document.getElementById('end-date').value = dt(end);
  }

  // init dates
  updateCustomDates();

  // History system
  let currentHistory = [];

  async function loadHistory() {
    try {
      const res = await fetch('/api/ads/strategy/history').then(r => r.json());
      if (res.success) {
        currentHistory = res.data;
        renderHistory();
      }
    } catch(e) { console.error('Failed to load history', e); }
  }

  function renderHistory() {
    const list = document.getElementById('history-list');
    if (currentHistory.length === 0) {
      list.innerHTML = '<div class="history-empty">Chưa có bản báo cáo nào được tạo.</div>';
      return;
    }
    
    list.innerHTML = currentHistory.map(h => {
      const d = new Date(h.created_at + 'Z').toLocaleString('vi-VN');
      return `
        <div class="history-item" onclick="viewHistory(${h.id}, this)">
          <div class="history-time">${h.time_label}</div>
          <div class="history-service">${h.service_label}</div>
          <div class="history-date">${d}</div>
          <button class="btn-delete-history" onclick="deleteHistory(${h.id}, event)" title="Xoá báo cáo này">🗑️</button>
        </div>
      `;
    }).join('');
  }

  async function deleteHistory(id, event) {
    event.stopPropagation(); // Ngăn chặn trigger viewHistory
    if(!confirm('Bạn có chắc chắn muốn xóa bản báo cáo kế hoạch này?')) return;
    
    try {
      const res = await fetch(`/api/ads/strategy/history/${id}`, { method: 'DELETE' }).then(r => r.json());
      if (res.success) {
        // Clear main view if active
        const wrap = document.getElementById('report-wrap');
        const activeItem = document.querySelector('.history-item.active');
        if (activeItem && activeItem.contains(event.target)) {
           wrap.innerHTML = `
            <div style="text-align:center; color:var(--muted); padding: 80px 0;">
              <div style="font-size:40px; margin-bottom:16px;">📈</div>
              <h3>Báo cáo đã bị xoá</h3>
            </div>
           `;
        }
        loadHistory();
      } else {
        alert('Lỗi xoá: ' + res.error);
      }
    } catch(e) {
      alert('Lỗi: ' + e.message);
    }
  }

  async function viewHistory(id, elm) {
    document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
    elm.classList.add('active');

    const wrap = document.getElementById('report-wrap');
    wrap.innerHTML = `<div class="loading-state"><div class="spinner"></div><div>Đang lấy hồ sơ...</div></div>`;
    
    try {
      const res = await fetch(`/api/ads/strategy/history/${id}`).then(r => r.json());
      if (res.success) {
        wrap.innerHTML = `<div class="markdown-body">${marked.parse(res.data.report_content)}</div>`;
      } else {
        wrap.innerHTML = `<div style="color:var(--red)">Lỗi: ${res.error}</div>`;
      }
    } catch (e) {
      wrap.innerHTML = `<div style="color:var(--red)">Lỗi: ${e.message}</div>`;
    }
  }

  loadHistory();

  async function generateStrategy() {
    const btn = document.getElementById('btn-submit');
    const wrap = document.getElementById('report-wrap');
    
    const timeVal = document.getElementById('time-range').options[document.getElementById('time-range').selectedIndex].text;
    const srvOption = document.getElementById('service-select').options[document.getElementById('service-select').selectedIndex];
    
    const reqBody = {
      timeLabel: timeVal,
      serviceLabel: srvOption.text,
      service_key: srvOption.value,
      start_date: document.getElementById('start-date').value,
      end_date: document.getElementById('end-date').value,
      leads: document.getElementById('input-leads').value,
      bookings: document.getElementById('input-bookings').value,
      arrivals: document.getElementById('input-arrivals').value,
      deals: document.getElementById('input-deals').value,
      revenue: document.getElementById('input-revenue').value
    };

    btn.disabled = true;
    wrap.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <div style="font-weight:600">Hệ Thống Đang Xử Lý Đa Luồng (Multi-Phase Mode)</div>
        <div style="font-size:13px; max-width:500px; text-align:center; line-height: 1.5; color: var(--accent2);">
          AI đang gọi 4 quy trình liên tiếp: Tổng Quan ➔ Mổ Xẻ Từng Content ➔ Đúc Kết Quy Luật ➔ Lập Kế Hoạch.<br>
          <span style="color: var(--yellow)">Vui lòng kiên nhẫn đợi từ 40 - 60 giây, cỗ máy sẽ trả về bản kế hoạch chuyên sâu tuyệt đối!</span>
        </div>
      </div>
    `;

    try {
      const res = await fetch('/api/ads/strategy', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(reqBody)
      }).then(r => r.json());

      if (res.success) {
        wrap.innerHTML = `<div class="markdown-body">${marked.parse(res.report)}</div>`;
        document.querySelectorAll('.history-item').forEach(el => el.classList.remove('active'));
        // reload history list to show the new one
        loadHistory();
      } else {
        wrap.innerHTML = `<div style="color:var(--red); padding:40px; text-align:center"><strong>Lỗi:</strong> ${res.error}</div>`;
      }
    } catch(e) {
      wrap.innerHTML = `<div style="color:var(--red); padding:40px; text-align:center"><strong>Lỗi kết nối mạng:</strong> ${e.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
